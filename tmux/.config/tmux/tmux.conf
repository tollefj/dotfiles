# Use Ctrl-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style copy mode with system clipboard
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Splitting
bind v split-window -h  # Split vertically (side-by-side)
bind s split-window -v  # Split horizontally (top-and-bottom)

# Toggle between the last two active panes instantly using Option-k
bind-key -n M-k last-pane

# Enable mouse
set -g mouse on

# Pass extended key sequences (e.g. Ctrl+/) through to applications like Neovim
set -g extended-keys on


