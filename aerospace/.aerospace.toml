config-version = 2
persistent-workspaces = ["1", "2", "3", "4", "5", "6"]

start-at-login = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
gaps.inner.horizontal = 10
gaps.inner.vertical   = 10
gaps.outer.left = 0
gaps.outer.right = 0
gaps.outer.top = [{ monitor.built-in = 4 }, 40]  # room for SketchyBar
gaps.outer.bottom = 0

[mode.main.binding]
# Hold Tab = alt-cmd-shift (Karabiner); Tab + Caps Lock adds ctrl
alt-cmd-shift-t = '''exec-and-forget ~/.config/aerospace/focus-or-new.sh com.googlecode.iterm2 "osascript -e 'tell application \"iTerm\" to create window with default profile'"'''
alt-cmd-shift-y = '''exec-and-forget ~/.config/aerospace/focus-or-new.sh net.waterfox.waterfox "/Applications/Waterfox.app/Contents/MacOS/waterfox --profile '$HOME/Library/Application Support/Waterfox/Profiles/q9V5tM8C.Profile 2' --new-window" "~/.config/aerospace/waterfox-profile-pid.sh 'q9V5tM8C.Profile 2'"'''
alt-cmd-shift-g = '''exec-and-forget ~/.config/aerospace/focus-or-new.sh net.waterfox.waterfox "/Applications/Waterfox.app/Contents/MacOS/waterfox --profile '$HOME/Library/Application Support/Waterfox/Profiles/26886r2e.default-release' --new-window" "~/.config/aerospace/waterfox-profile-pid.sh '26886r2e.default-release'"'''
alt-cmd-shift-v = 'exec-and-forget open -a "Safari"'
alt-cmd-shift-o = '''exec-and-forget ~/.config/aerospace/focus-or-new.sh md.obsidian "osascript -e 'tell application \"System Events\" to keystroke \"n\" using {command down, shift down}'"'''
alt-cmd-shift-c = 'exec-and-forget open -a "Claude"'
alt-cmd-shift-s = 'exec-and-forget open -a "Slack"'
alt-cmd-shift-e = '''exec-and-forget osascript -e 'tell application "Finder" to make new Finder window' -e 'tell application "Finder" to activate''''
alt-cmd-shift-m = 'exec-and-forget open -a "Mail"'
alt-cmd-shift-i = 'exec-and-forget open -a "Microsoft Teams"'
alt-cmd-shift-x = 'exec-and-forget open -a "Signal"'
alt-cmd-shift-d = 'close'
alt-cmd-shift-w = 'focus-back-and-forth'
alt-cmd-shift-q = 'exec-and-forget ~/.config/aerospace/pull-previous.sh'
alt-cmd-shift-h = 'focus left'
alt-cmd-shift-j = 'focus down'
alt-cmd-shift-k = 'focus up'
alt-cmd-shift-u = 'exec-and-forget open -a "Microsoft Outlook"'
alt-cmd-shift-l = 'focus right'
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'
alt-cmd-shift-f = 'fullscreen'
alt-cmd-shift-r = 'layout tiles horizontal vertical'
alt-cmd-shift-a = 'exec-and-forget ~/.config/aerospace/tile-all.sh'
alt-cmd-shift-b = 'balance-sizes'
alt-cmd-shift-7 = 'exec-and-forget ~/.config/aerospace/fix-workspaces.sh'
alt-cmd-shift-comma = 'resize smart -50'
alt-cmd-shift-period = 'resize smart +50'
alt-cmd-shift-n = 'move-node-to-monitor --wrap-around --focus-follows-window next'
alt-cmd-shift-1 = 'workspace 1'
alt-cmd-shift-2 = 'workspace 2'
alt-cmd-shift-3 = 'workspace 3'
alt-cmd-shift-4 = 'workspace 4'
alt-cmd-shift-5 = 'workspace 5'
alt-cmd-shift-6 = 'workspace 6'
alt-cmd-shift-0 = 'exec-and-forget ~/.config/aerospace/position-single.sh center'
alt-cmd-shift-8 = 'exec-and-forget ~/.config/aerospace/position-single.sh left'
alt-cmd-shift-9 = 'exec-and-forget ~/.config/aerospace/position-single.sh right'
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
ctrl-alt-cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
ctrl-alt-cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
ctrl-alt-cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'

[[on-window-detected]]
if = 'true'
check-further-callbacks = true
run = 'exec-and-forget ~/.config/aerospace/master-stack.sh'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'net.waterfox.waterfox'
run = 'exec-and-forget ~/.config/aerospace/waterfox-workspace.sh'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.microsoft.Word'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.microsoft.Powerpoint'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.microsoft.Excel'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if = 'true'
run = 'move-node-to-workspace 2'
