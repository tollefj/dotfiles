config-version = 2
persistent-workspaces = ["1", "2", "3"]

start-at-login = true
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
  'exec-and-forget sketchybar'
]
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
gaps.inner.horizontal = 10
gaps.inner.vertical   = 10
gaps.outer.left = 10
gaps.outer.right = 10
gaps.outer.top = [{ monitor.main = 40 }, 10]  # room for SketchyBar
gaps.outer.bottom = 10

[mode.main.binding]
# Hyper = ctrl-alt-cmd, sent by holding Tab (Karabiner)
ctrl-alt-cmd-t = 'exec-and-forget open -a iTerm'
ctrl-alt-cmd-y = 'exec-and-forget open -a Waterfox'
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'
ctrl-alt-cmd-f = 'fullscreen'
ctrl-alt-cmd-9 = 'layout tiles horizontal vertical'
ctrl-alt-cmd-0 = 'layout accordion horizontal vertical'
ctrl-alt-cmd-b = 'balance-sizes'
ctrl-alt-cmd-comma = 'resize smart -50'
ctrl-alt-cmd-period = 'resize smart +50'
ctrl-alt-cmd-n = 'move-node-to-monitor --wrap-around --focus-follows-window next'
ctrl-alt-cmd-tab = 'workspace-back-and-forth'
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace 1'
